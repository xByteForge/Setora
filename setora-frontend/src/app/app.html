@if (auth.isAuthenticated() || hideSidebar()) {
  <div class="app-layout" [class.no-sidebar]="hideSidebar()">
    @if (auth.isAuthenticated() && !hideSidebar()) {
      <app-sidebar></app-sidebar>
    }
    <main class="main-content">
      <app-topbar
        [hideSidebar]="hideSidebar()"
        [backUrl]="topbarBackUrl()"
        [backLabelKey]="topbarBackLabelKey()"
      ></app-topbar>
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
} @else {
  <div class="guest-shell">
    <router-outlet></router-outlet>
  </div>
}
