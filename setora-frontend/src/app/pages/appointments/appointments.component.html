<app-appointments-header
  [summary]="summary()"
  (addClicked)="openAddAppointment()"
/>

@if (isMobile()) {
  <label class="mobile-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
    </svg>
    <!-- TODO: leagă la căutarea reală -->
    <input type="search" [placeholder]="'HEADER.SEARCH' | transloco" />
  </label>
}

<app-appointment-filters
  [locations]="locations()"
  [employees]="employees()"
  [(filters)]="filters"
/>

<div class="calendar-layout" [class.calendar-layout--with-details]="selectedAppointment()">
  @if (isMobile()) {
    <app-appointment-agenda
      [appointments]="visibleAppointments()"
      [employees]="visibleEmployees()"
      [selectedId]="selectedId()"
      (appointmentSelected)="selectedId.set($event)"
      [(selectedDate)]="selectedDate" />
  } @else {
    <app-appointment-calendar
      [employees]="visibleEmployees()"
      [appointments]="visibleAppointments()"
      [timeRange]="filters().timeRange"
      [selectedId]="selectedId()"
      (appointmentSelected)="selectedId.set($event)"
      [(selectedDate)]="selectedDate"
      [(view)]="view" />
  }

  @if (selectedAppointment(); as appt) {
    <app-appointment-details
      [appointment]="appt"
      [locationName]="selectedLocationName()"
      (closed)="closeDetails()"
      (edit)="editAppointment($event)"
      (cancelRequested)="cancelAppointment($event)" />
  }
</div>

<!-- Dialog de adăugare -->
@if (addOpen()) {
  <app-appointment-form-dialog
    [selectedDate]="selectedDate()"
    [locations]="locations()"
    (closed)="closeAddAppointment()"
    (created)="onAppointmentCreated($event)" />
}

<!-- Dialog de editare -->
@if (editTarget(); as appt) {
  <app-appointment-form-dialog
    [appointment]="appt"
    [selectedDate]="selectedDate()"
    [locations]="locations()"
    (closed)="closeEdit()"
    (updated)="onAppointmentUpdated($event)" />
}

<!-- Confirmare anulare -->
@if (cancelTarget(); as appt) {
  <app-cancel-appointment-dialog
    [appointment]="appt"
    [locationName]="locationName(appt.locationId)"
    [busy]="cancelBusy()"
    [failed]="cancelFailed()"
    (closed)="closeCancel()"
    (confirmed)="confirmCancel()" />
}

@if (toast(); as key) {
  <div class="toast" role="status">{{ key | transloco }}</div>
}
