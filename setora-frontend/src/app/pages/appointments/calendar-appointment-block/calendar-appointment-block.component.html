@if (compact()) {
    <p class="block__client">{{ appointment().clientName }}</p>
    <p class="block__time">{{ timeRange() }}</p>
} @else {
    <p class="block__time">{{ timeRange() }}</p>
    <p class="block__client">{{ appointment().clientName }}</p>
    <p class="block__meta">
        {{ appointment().service }} ·
        {{ 'APPOINTMENTS.CALENDAR.STATUS.' + appointment().status.toUpperCase() | transloco }}
    </p>
}
