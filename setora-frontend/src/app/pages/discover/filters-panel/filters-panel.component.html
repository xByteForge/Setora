<ng-container *transloco="let t">
  <div class="backdrop" (click)="closed.emit()"></div>

  <form
    class="panel"
    role="dialog"
    aria-labelledby="fp-title"
    (submit)="$event.preventDefault(); apply()"
  >
    <div class="panel-head">
      <h3 id="fp-title">{{ t('DISCOVER.FILTERS.TITLE') }}</h3>
      <button
        type="button"
        class="close"
        (click)="closed.emit()"
        [attr.aria-label]="t('DISCOVER.FILTERS.CLOSE')"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="field">
      <label for="fp-category">{{ t('DISCOVER.FILTERS.CATEGORY') }}</label>
      <select id="fp-category" (change)="onCategory($event)">
        <option value="" [selected]="draft().category === ''">
          {{ t('DISCOVER.FILTERS.ALL_CATEGORIES') }}
        </option>
        @for (c of service.categories(); track c) {
          <option [value]="c" [selected]="c === draft().category">{{ c }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="fp-service">{{ t('DISCOVER.FILTERS.SERVICE') }}</label>
      <select id="fp-service" (change)="onField('serviceId', $event)">
        <option value="" [selected]="draft().serviceId === ''">
          {{ t('DISCOVER.FILTERS.ALL_SERVICES') }}
        </option>
        @for (s of serviceOptions(); track s.id) {
          <option [value]="s.id" [selected]="'' + s.id === draft().serviceId">{{ s.name }}</option>
        }
      </select>
    </div>

    @if (!draft().serviceId) {
        <p class="filter-hint" role="status">
            <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
            >
                <circle cx="12" cy="12" r="9.5" />
                <path d="M12 11.5v4.5" />
                <circle cx="12" cy="8" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span>{{ t('DISCOVER.FILTERS.SELECT_SERVICE_HINT') }}</span>
        </p>
    }

    <div class="field">
      <span class="label" id="fp-price-label">{{ t('DISCOVER.FILTERS.PRICE') }}</span>
      <div class="price-row" role="group" aria-labelledby="fp-price-label">
        <input
          type="number"
          min="0"
          inputmode="numeric"
          [disabled]="!draft().serviceId"
          [placeholder]="t('DISCOVER.FILTERS.MIN')"
          [attr.aria-label]="t('DISCOVER.FILTERS.MIN')"
          [value]="draft().minPrice"
          (input)="onField('minPrice', $event)"
        />
        <input
          type="number"
          min="0"
          inputmode="numeric"
          [disabled]="!draft().serviceId"
          [placeholder]="t('DISCOVER.FILTERS.MAX')"
          [attr.aria-label]="t('DISCOVER.FILTERS.MAX')"
          [value]="draft().maxPrice"
          (input)="onField('maxPrice', $event)"
        />
      </div>
    </div>

    <div class="field">
      <label for="fp-date">{{ t('DISCOVER.FILTERS.DATE') }}</label>
      <input id="fp-date" type="date" [disabled]="!draft().serviceId" [value]="draft().date" (change)="onField('date', $event)" />
    </div>

    <div class="field">
      <label for="fp-time">{{ t('DISCOVER.FILTERS.TIME_LABEL') }}</label>
      <select id="fp-time" [disabled]="!draft().serviceId" (change)="onField('time', $event)">
        @for (s of timeSlots; track s) {
          <option [value]="s" [selected]="s === draft().time">
            {{ t('DISCOVER.FILTERS.TIME.' + s) }}
          </option>
        }
      </select>
    </div>

    <button type="submit" class="btn-primary">
      <span class="label-desktop">{{ t('DISCOVER.FILTERS.APPLY') }}</span>
      <span class="label-mobile">{{
        t('DISCOVER.FILTERS.SHOW_RESULTS', { count: previewCount() })
      }}</span>
    </button>
    <button type="button" class="btn-ghost" (click)="reset()">
      {{ t('DISCOVER.FILTERS.RESET') }}
    </button>
  </form>
</ng-container>
