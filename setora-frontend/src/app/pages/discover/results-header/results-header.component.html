<div class="header" *transloco="let t">
  <div class="titles">
    <h2>
      @if (service.query().city; as city) {
        {{
          t('DISCOVER.RESULTS_COUNT', {
            count: service.result().totalElements,
            city,
          })
        }}
      } @else {
        {{
          t('DISCOVER.RESULTS_COUNT_ALL', {
            count: service.result().totalElements,
          })
        }}
      }
    </h2>
    <p>{{ t('DISCOVER.RESULTS_SUBTITLE') }}</p>
  </div>
</div>
