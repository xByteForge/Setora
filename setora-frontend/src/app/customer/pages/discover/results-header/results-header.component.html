<div class="header" *transloco="let t">
    <div class="titles">
        <h2>{{ t('DISCOVER.RESULTS_COUNT', { count: service.result().total, city: service.query().city }) }}</h2>
        <p>{{ t('DISCOVER.RESULTS_SUBTITLE') }}</p>
    </div>

    <button type="button" class="filters-btn" [class.active]="open()"
            [attr.aria-expanded]="open()" (click)="toggle.emit()">
    <span>
      {{ service.activeFilterCount() > 0
        ? t('DISCOVER.FILTERS.BUTTON_COUNT', { count: service.activeFilterCount() })
        : t('DISCOVER.FILTERS.BUTTON') }}
    </span>
        <i class="fa-solid fa-sliders" aria-hidden="true"></i>
    </button>
</div>
