<div class="filters" *transloco="let t">
    <div class="field">
        <label for="f-city">{{ t('DISCOVER.FILTERS.CITY') }}</label>
        <select id="f-city" (change)="onCity($event)">
            @for (c of service.cities; track c) {
                <option [value]="c" [selected]="c === service.query().city">{{ c }}</option>
            }
        </select>
    </div>

    <div class="field">
        <label for="f-sort">{{ t('DISCOVER.FILTERS.SORT') }}</label>
        <select id="f-sort" (change)="onSort($event)">
            @for (s of sortOptions; track s) {
                <option [value]="s" [selected]="s === service.query().sort">{{ t('DISCOVER.SORT.' + s) }}</option>
            }
        </select>
    </div>
</div>
