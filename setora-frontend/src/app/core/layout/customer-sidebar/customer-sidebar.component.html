@if (menu.open()) {
    <div class="backdrop" (click)="menu.close()"></div>
}

<aside class="sidebar" [class.sidebar--open]="menu.open()">
    <div class="mobile-head">
        <h2 class="mobile-title">{{ 'MENU.TITLE' | transloco }}</h2>
        <button type="button" class="mobile-close" (click)="menu.close()"
                [attr.aria-label]="'APPOINTMENTS.DETAILS.CLOSE' | transloco">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
            </svg>
        </button>
    </div>

    <div class="sidebar-header">
        <div class="logo-plaque">
            <img src="assets/logo.jpg" alt="SETORA" class="logo" />
        </div>
    </div>

    <nav class="sidebar-nav">
        @for (item of navItems; track item.path) {
            @if (item.disabled) {
                <span class="nav-link nav-link--disabled" aria-disabled="true">
          <i [class]="item.iconClass" aria-hidden="true"></i>
          <span class="nav-label">{{ item.labelKey | transloco }}</span>
        </span>
            } @else {
                <a [routerLink]="item.path" routerLinkActive="active" class="nav-link" (click)="menu.close()">
                    <i [class]="item.iconClass" aria-hidden="true"></i>
                    <span class="nav-label">{{ item.labelKey | transloco }}</span>
                </a>
            }
        }
    </nav>

    @if (showFilters()) {
        <div class="filters-wrap">
            <app-business-filters />
        </div>
    }

    <div class="sidebar-footer">
        <button type="button" class="theme-row" (click)="theme.toggleTheme()">
            <span>{{ 'MENU.THEME' | transloco }}</span>
            <strong>{{ (theme.currentTheme() === 'light' ? 'MENU.LIGHT' : 'MENU.DARK') | transloco }}</strong>
        </button>

        <div class="user-card">
            <div class="avatar">{{ userInitials }}</div>
            <div class="user-info">
                <span class="user-name">{{ userName }}</span>
                <span class="user-role">{{ userRole }}</span>
            </div>
        </div>
    </div>
</aside>
